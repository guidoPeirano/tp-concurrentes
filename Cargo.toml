[workspace]
resolver = "2"
members = ["comun", "estacion", "pasarela", "usuario"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
actix = "0.13"
clap = { version = "4", features = ["derive"] }
